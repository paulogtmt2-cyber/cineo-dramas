name: Gerar e testar APK
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cineo-signing/debug.keystore
          key: cineo-debug-signing-v1
      - name: Prepare reusable debug signing key
        run: |
          mkdir -p "$RUNNER_TEMP/cineo-signing"
          if [ ! -f "$RUNNER_TEMP/cineo-signing/debug.keystore" ]; then
            keytool -genkeypair -keystore "$RUNNER_TEMP/cineo-signing/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify cache isolation and mutation behavior
        run: python3 ci/test_cache.py
      - run: gradle -p android assembleDebug assembleDebugAndroidTest
        env:
          CINEO_DEBUG_KEYSTORE: ${{ runner.temp }}/cineo-signing/debug.keystore
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Parse and verify backend modules
        run: node --experimental-strip-types ci/check_backend.mjs
      - name: Verify profile and worker boundaries
        run: node --experimental-strip-types --test ci/test_platform.mjs
      - name: Verify public API boundaries
        env:
          CINEO_TEST_API: https://njyjwcjrirqmbvsizqar.supabase.co/functions/v1/cineo
        run: python3 ci/api-smoke.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash ci/android-ui.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cineo-Validacao
          path: |
            screenshots
            android-ui-test.log
      - uses: actions/upload-artifact@v4
        with:
          name: Cineo-Dramas-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
