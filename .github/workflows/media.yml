name: Preparar vídeos Cineo
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
  push:
    paths: ['ci/media-worker.py', '.github/workflows/media.yml']
permissions:
  contents: read
  id-token: write
concurrency:
  group: cineo-media
  cancel-in-progress: true
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Test media pipeline
        run: python3 ci/test_media.py
      - name: Validate and prepare queued videos
        env:
          CINEO_API_BASE: https://njyjwcjrirqmbvsizqar.supabase.co/functions/v1/cineo-preview
        run: python3 ci/media-worker.py
