plugins { id 'com.android.application' }
android {
 namespace 'br.com.cineo'
 compileSdk 35
 signingConfigs {
  debug {
   if (System.getenv('CINEO_DEBUG_KEYSTORE')) {
    storeFile file(System.getenv('CINEO_DEBUG_KEYSTORE'))
    storePassword 'android'
    keyAlias 'androiddebugkey'
    keyPassword 'android'
   }
  }
 }
 defaultConfig { applicationId 'br.com.cineo'; minSdk 26; targetSdk 35; versionCode 3; versionName '0.3.0'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test:rules:1.6.1'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
