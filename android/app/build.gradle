plugins { id 'com.android.application' }
android {
 namespace 'br.com.cineo'
 compileSdk 35
 signingConfigs {
  debug {
   if (System.getenv('CINEO_DEBUG_KEYSTORE')) {
    storeFile file(System.getenv('CINEO_DEBUG_KEYSTORE'))
    storePassword 'android'
    keyAlias 'androiddebugkey'
    keyPassword 'android'
   }
  }
 }
 defaultConfig { applicationId 'br.com.cineo'; minSdk 26; targetSdk 35; versionCode 10; versionName '0.10.0'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
 implementation 'androidx.appcompat:appcompat:1.7.0'
 implementation 'androidx.mediarouter:mediarouter:1.7.0'
 implementation 'com.google.android.gms:play-services-cast-framework:22.1.0'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test:rules:1.6.1'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
